[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "quadcast2s"
version = "0.2.0"
description = "RGB lighting control for the HyperX QuadCast 2 S"
readme = "README.md"
requires-python = ">=3.9"
license = "AGPL-3.0-only"
authors = [{ name = "Coruscnium", email = "coru-personal+github@coruscnium.xyz" }]
keywords = ["hyperx", "quadcast", "rgb", "usb", "hid"]
dependencies = ["pyusb>=1.2"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Hardware",
]

[project.optional-dependencies]
gui = ["PySide6>=6.5"]

[project.scripts]
quadcast2s = "quadcast2s.__main__:main"

[project.gui-scripts]
quadcast2s-gui = "quadcast2s.gui.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
