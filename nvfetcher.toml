# Upstream sources nixpkgs doesn't package, or packages too old.
#
# nvfetcher resolves each src.* version and rewrites _sources/generated.nix, so
# bumping is a command:
#   nix run nixpkgs#nvfetcher && nixos-rebuild switch --flake .#coru
#
# NOT covered (deliberate): themes/ (pling serves a bot challenge), scripts/ (our
# own code).
#
# Table names go at the ROOT -- nvfetcher 0.8 rejects a [sources.*] wrapper.

[cherry-studio]
# nixpkgs is stuck at 1.9.11, so wrap upstream's AppImage instead.
src.github = "CherryHQ/cherry-studio"
# tags are "v2.1.4" but the release assets drop the "v"
src.prefix = "v"
fetch.url = "https://github.com/CherryHQ/cherry-studio/releases/download/v$ver/Cherry-Studio-$ver-linux-x64.AppImage"
url.name = "Cherry-Studio-$ver-linux-x64.AppImage"

[elegooslicer]
# Elegoo's OrcaSlicer fork; only shipped as a Linux AppImage. Tags are "v1.5.3.5"
# but the asset keeps a literal capital V. NOTE: v1.5.2.2 named its asset
# "..._Linux_Ubuntu2404_V<ver>.AppImage" -- if that form returns, this URL 404s.
src.github = "elegooofficial/ElegooSlicer"
src.prefix = "v"
fetch.url = "https://github.com/elegooofficial/ElegooSlicer/releases/download/v$ver/ElegooSlicer_Linux_V$ver.AppImage"
url.name = "ElegooSlicer_Linux_V$ver.AppImage"

[astra]
# Boof2015/astra -- audiophile music player (Electron). nixpkgs has nothing and
# upstream posts no source, only AppImage / deb / rpm. Tags carry a "-beta"
# suffix, so the version nvfetcher resolves is "0.8.0-beta".
src.github = "Boof2015/astra"
src.prefix = "v"
fetch.url = "https://github.com/Boof2015/astra/releases/download/v$ver/Astra-$ver-Linux.AppImage"
url.name = "Astra-$ver-Linux.AppImage"
